# Runs the pytest suite on Windows, macOS and Linux.
#
# Why three OSes: ping, traceroute and socket error codes differ between
# them (e.g. "connection refused" is error 111 on Linux, 61 on macOS and
# 10061 on Windows), so every platform gets its own run.
#
# Why 3.10 and 3.13: the oldest supported Python (pyproject requires >=3.10)
# and the newest one we develop on.
#
# The tests never touch the internet: a fixture in tests/conftest.py blocks
# any connection or DNS lookup that isn't to this machine.
#
# Added in v0.1.0
name: tests

on:
  push:
  pull_request:
  # Monthly run (09:00 UTC on the 1st) catches breakage from new Python or
  # runner-image releases even when nobody has pushed code.
  schedule:
    - cron: "0 9 1 * *"
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read  # the tests only need to read the code

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false  # keep the other results even if one combination fails
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Editable install with the dev extra (pytest, psutil, mypy, types-psutil,
      # pyflakes), same as the README.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

      # Type check (settings in pyproject.toml) and unused-import check.
      - name: Type check
        run: |
          python -m mypy
          python -m pyflakes netscope tests

      # Real commands against this runner only (localhost), never other hosts.
      - name: Smoke test
        run: |
          python -m netscope --version
          python -m netscope info
          python -m netscope scan 127.0.0.1 --ports 1-1024 --json

      # Windows answers a refused connection slowly (it retries for about two
      # seconds), which is why its default --timeout is 3 s. This runs a full
      # 1-1024 scan of the runner itself with that default, so the log shows
      # how long it takes and how many ports came back closed vs filtered.
      - name: Windows loopback scan
        if: runner.os == 'Windows'
        run: python -m netscope scan 127.0.0.1 -p 1-1024 --show-closed
